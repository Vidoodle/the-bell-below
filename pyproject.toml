[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "wayfarer-roleplay"
version = "0.1.0"
description = "Typed content contracts and headless adventure data for The Bell Below."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.13,<3"]

[project.optional-dependencies]
dev = [
  "mypy>=1.15",
  "pytest>=8.3",
  "ruff>=0.11",
]

[project.scripts]
wayfarer-validate = "wayfarer.adventure.validation:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/wayfarer"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["backend/src"]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "backend/src"
plugins = ["pydantic.mypy"]

