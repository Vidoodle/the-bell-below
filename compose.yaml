services:
  postgres-dev:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bell_below_dev
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      POSTGRES_USER: bell_below
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bell_below -d bell_below_dev"]
      interval: 2s
      timeout: 3s
      retries: 15

  postgres-test:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: bell_below_test
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      POSTGRES_USER: bell_below
    ports:
      - target: 5432
        host_ip: 127.0.0.1
        protocol: tcp
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bell_below -d bell_below_test"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-dev-data:
